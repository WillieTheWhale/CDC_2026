# AI-assisted: written with Claude Code (Anthropic). See docs/AI_USAGE.md.
[project]
name = "trace-backend"
version = "0.1.0"
description = "TRACE backend: drug-trade route network, spillover risk, and API (CDC 2026)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "apscheduler>=3.10,<4",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
trace = "trace_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trace_backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
