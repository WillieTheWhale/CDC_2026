# AI-assisted: written with Claude Code (Anthropic). See docs/AI_USAGE.md.
#
# TRACE API contract. This file is the seam between backend/ and frontend/.
# Never change a response shape silently: contract changes get their own commit,
# updated fixtures in contracts/fixtures/, and a line in docs/CHANGELOG_CONTRACT.md.
#
# Conventions
# - Every JSON response is an envelope: { "meta": ResponseMeta, "data": <payload> }.
# - Country codes are ISO 3166-1 alpha-3 (World Bank `id`), upper case.
# - Drugs: cocaine (includes crack), heroin (opiates), meth, cannabis.
# - Every World Bank number carries provenance: { code, source_id, year, value }.
# - Scores are 0 to 100. Higher exposure/vulnerability = worse; higher protection = better.
# - Design boundary: no field or ranking describes where enforcement is weak or how to
#   avoid detection. Outputs describe flows, harms, and prevention capacity only.
openapi: 3.1.0
info:
  title: TRACE API
  version: 1.0.0
  description: >
    Drug-trade terminal with spillover-risk early warning (2026 Carolina Data Challenge,
    Graduate track). Serves precomputed route networks, country profiles, spillover risk
    scores, experiments, model metrics, a shock simulator, and a live classified newswire.
servers:
  - url: http://localhost:8000
    description: Local backend (uvicorn)

paths:
  /api/meta:
    get:
      operationId: getMeta
      summary: Available years, drugs, model version, data freshness per source
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaResponse" }

  /api/countries:
    get:
      operationId: listCountries
      summary: All World Bank economies (aggregates excluded)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountriesResponse" }

  /api/routes:
    get:
      operationId: getRoutes
      summary: Route edges for a year (observed or predicted)
      parameters:
        - name: drug
          in: query
          required: false
          description: Filter to one drug. Omit for all drugs.
          schema: { $ref: "#/components/schemas/Drug" }
        - name: year
          in: query
          required: false
          description: Defaults to the latest observed year (observed) or first predicted year (predicted).
          schema: { type: integer }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [observed, predicted], default: observed }
        - name: min_confidence
          in: query
          required: false
          description: Drop edges with confidence below this value (0-100).
          schema: { type: number, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutesResponse" }
        "404":
          description: Year not available for this mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/country/{iso3}:
    get:
      operationId: getCountry
      summary: Country profile (indicators with provenance, routes, prices, OC Index, harm reduction, risk)
      parameters:
        - name: iso3
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Z]{3}$" }
        - name: year
          in: query
          required: false
          description: Profile year. Defaults to the latest scored year.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryResponse" }
        "404":
          description: Unknown country code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/risk:
    get:
      operationId: getRisk
      summary: Spillover risk board, ranked
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 250 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskResponse" }
        "404":
          description: Year not available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/prices:
    get:
      operationId: getPrices
      summary: Retail and wholesale price series (USD per gram)
      parameters:
        - name: drug
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Drug" }
        - name: iso3
          in: query
          required: false
          schema: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricesResponse" }

  /api/simulate:
    post:
      operationId: simulate
      summary: Run a shock scenario through the route model and propagate to risk scores
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulateResponse" }
        "422":
          description: Scenario could not be parsed or shocks are invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/experiments/afghan-ban:
    get:
      operationId: getAfghanBan
      summary: Afghanistan 2022 opium ban natural experiment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AfghanBanResponse" }

  /api/metrics:
    get:
      operationId: getMetrics
      summary: Backtest metrics, spillover hypothesis test, Live Wire classifier accuracy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }

  /api/livewire:
    get:
      operationId: getLivewire
      summary: Recent classified news events (REST fallback for the WebSocket)
      parameters:
        - name: since
          in: query
          required: false
          description: ISO 8601 timestamp; only events published after it.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: drug
          in: query
          required: false
          schema: { $ref: "#/components/schemas/LiveDrug" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivewireResponse" }

  /api/command:
    post:
      operationId: parseCommand
      summary: Free-text command bar input to a structured intent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /api/people:
    get:
      operationId: getPeople
      summary: Paginated, source-cited people (country-level associations only)
      description: >
        Curated sample of publicly reported people, not a census. Without `search`, `country` or `unlocated`,
        only people at or above the zoom's prominence tier are returned, optionally within `bbox` (a person
        matches if any associated country's capital is inside it). `search` matches names and aliases across all
        tiers; `country` returns all tiers for one ISO3; `unlocated=1` returns all tiers of people with no sourced
        country. Sorted by case-folded name, then id. Page with `meta.next_cursor` (bound to the filters; it
        encodes the last sort key, so it stays valid when the dataset refreshes).
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: zoom, in: query, required: false, schema: { type: integer, enum: [1, 2, 3], default: 1 } }
        - name: bbox
          in: query
          required: false
          description: "west,south,east,north in degrees (east may exceed 180 for antimeridian spans)."
          schema: { type: string }
        - { name: country, in: query, required: false, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - name: unlocated
          in: query
          required: false
          description: >
            "1" lists published people with no sourced country (`regions: []`) across all prominence tiers
            (zoom ignored); `search` still matches names and aliases. Combining it with `country` or `bbox` is a
            400. No country, centroid or marker is invented for these records.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeoplePageResponse" }
        "400":
          description: Invalid bbox, unlocated combined with country or bbox, or a cursor from different filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/people/countries:
    get:
      operationId: getPeopleCountries
      summary: Per-country people counts (all tiers, and visible at this zoom)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: zoom, in: query, required: false, schema: { type: integer, enum: [1, 2, 3], default: 3 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleCountriesResponse" }

  /api/people/network:
    get:
      operationId: getPeopleNetwork
      summary: A person's documented connections (first 48 by id) and the people and organizations involved
      parameters:
        - { name: person_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleNetworkResponse" }
        "404":
          description: Unknown person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/people/{person_id}:
    get:
      operationId: getPerson
      summary: One person's evidence record, organizations and documented connections
      parameters:
        - { name: person_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonResponse" }
        "404":
          description: Unknown person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/route-evidence:
    get:
      operationId: getRouteEvidence
      summary: Paginated, cited route evidence (country pairs and regional context) behind /api/routes edges
      description: >
        Three layers flagged by `pair_type`: `direct_reported_pair` (a country pair stated verbatim in a cited
        publication at an exact locator), `interpreted_corridor` (TRACE's transcription of UNODC/EUDA regional route
        maps and report text, seed/corridors.csv), and `narrative_context` (multiregional UNODC statements kept as
        text, `from`/`to` null). No volumes and no city, road or port geometry. With `bbox`, a record matches if
        either endpoint's capital is inside (narrative records have no point and drop out). Stable order: direct
        pairs, interpreted corridors, narrative context. Page with `meta.next_cursor`.
      parameters:
        - { name: drug, in: query, required: false, schema: { $ref: "#/components/schemas/Drug" } }
        - { name: from, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
        - name: iso3
          in: query
          required: false
          description: Either endpoint.
          schema: { type: string, pattern: "^[A-Za-z]{3}$" }
        - { name: pair_type, in: query, required: false, schema: { $ref: "#/components/schemas/RouteEvidencePairType" } }
        - { name: basis, in: query, required: false, description: "Exact basis string.", schema: { type: string, maxLength: 120 } }
        - name: bbox
          in: query
          required: false
          description: "west,south,east,north in degrees (east may exceed 180 for antimeridian spans)."
          schema: { type: string }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 4096 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteEvidencePageResponse" }
        "400":
          description: Invalid bbox or a cursor from different filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/route-evidence/sources:
    get:
      operationId: getRouteEvidenceSources
      summary: Every publication (or TRACE transcription) cited by a route-evidence record
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteEvidenceSourcesResponse" }

  /api/route-evidence/{evidence_id}:
    get:
      operationId: getRouteEvidenceItem
      summary: One route-evidence record
      parameters:
        - { name: evidence_id, in: path, required: true, schema: { type: string }, example: "cocaine:COL:ECU:unodc-cocaine-2023" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteEvidenceItemResponse" }
        "404":
          description: Unknown evidence id (code unknown_evidence)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/evidence/values:
    get:
      operationId: listEvidenceValues
      summary: Drillable values (research metric_ids and market derived_ids), paginated
      description: >
        Research values are TRACE's small retrospective research layer (research_values); market values are
        exact-product UNODC price/purity derivations (market_derived). Sorted by kind (market, research) then id.
        `drug` matches research drugs exactly and market substances by substring (meth -> methamphetamine).
        Page with `meta.next_cursor`; `meta.total` counts all matches.
      parameters:
        - { name: iso3, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
        - { name: drug, in: query, required: false, schema: { type: string, maxLength: 60 } }
        - { name: year, in: query, required: false, schema: { type: integer } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [research, market] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceValuesResponse" }
        "400":
          description: A cursor from different filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/evidence/value/{value_id}:
    get:
      operationId: getEvidenceValue
      summary: "Drilldown: value -> formula/version -> exact input rows -> source URL, edition and workbook cells"
      description: >
        `value_id` is a research `metric_id` or a market `derived_id` (digits). `support_count` is linked input rows,
        not independent countries. `source_publication_year` is the source edition, never the collection date, and
        is null when the source does not state one (World Bank; its `lastupdated` is in `inputs[].world_bank`).
        Seizure inputs carry every published annex edition and label source-edition revisions.
      parameters:
        - { name: value_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceValueResponse" }
        "404":
          description: Unknown value id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/evidence/health/{iso3}:
    get:
      operationId: getEvidenceHealth
      summary: Drug-use prevalence observations and SDG 3.5.1 treatment coverage (modelled vs country-reported)
      description: >
        Prevalence rows keep source-native population, age group, sex and reference period (UNODC WDR 2026 annex
        1.2/1.4). Treatment coverage labels every row: nature_code M = officially modelled estimate, C = country
        reported. `limit` caps each list; `total` counts all rows.
      parameters:
        - { name: iso3, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z]{3}$" } }
        - { name: reference_period, in: query, required: false, schema: { type: string, enum: [past_year, past_month, lifetime] } }
        - { name: substance, in: query, required: false, description: "Exact prevalence substance or SDG substance group (case-insensitive).", schema: { type: string, maxLength: 80 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceHealthResponse" }
        "404":
          description: No health evidence rows for this code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/evidence/overdose:
    get:
      operationId: getEvidenceOverdose
      summary: CDC provisional 12-month-ending overdose deaths for one jurisdiction (exact CDC labels), paginated
      description: >
        12-month-ending provisional; periods overlap and must not be summed; drug classes overlap; suppressed values
        are null. Sorted by period end, then indicator. Page with `meta.next_cursor`.
      parameters:
        - { name: state, in: query, required: false, description: "CDC jurisdiction code (US, NY, YC, ...).", schema: { type: string, pattern: "^[A-Za-z]{2}$", default: US } }
        - { name: indicator, in: query, required: false, description: "Exact CDC indicator label.", schema: { type: string, maxLength: 120 } }
        - { name: from_year, in: query, required: false, schema: { type: integer } }
        - { name: to_year, in: query, required: false, schema: { type: integer } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceOverdoseResponse" }
        "400":
          description: A cursor from different filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Unknown jurisdiction or indicator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/evidence/research-model:
    get:
      operationId: getEvidenceResearchModel
      summary: The single prespecified retrospective model (cocaine seizures vs next-year general homicide)
      description: Retrospective ecological association only; not route validation, causal identification or a forecast.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceResearchModelResponse" }

components:
  schemas:
    # ---------- primitives ----------
    Drug:
      type: string
      enum: [cocaine, heroin, meth, cannabis]
    LiveDrug:
      description: Live Wire drug labels (wider than the route model; fentanyl appears only here).
      type: string
      enum: [cocaine, heroin, meth, cannabis, fentanyl, other, unclear]
    Iso3:
      type: string
      pattern: "^[A-Z]{3}$"
    NullableNumber:
      type: [number, "null"]

    SourceRef:
      type: object
      required: [id, name, url]
      properties:
        id: { type: string, description: "Short stable id, e.g. wb_wdi, unodc_wdr_annex" }
        name: { type: string }
        url: { type: string }
        citation: { type: string }

    ResponseMeta:
      type: object
      required: [generated_at, model_version, sources]
      properties:
        generated_at: { type: string, format: date-time }
        model_version: { type: string }
        sources:
          description: Sources that contributed to this response (cite in the UI).
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        notes:
          type: array
          items: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    WbValue:
      description: One World Bank observation with provenance.
      type: object
      required: [code, source_id, year, value]
      properties:
        code: { type: string, example: GOV_WGI_RL.EST }
        source_id: { type: integer, example: 3 }
        year: { type: [integer, "null"], description: "Year of the observation actually used (null if no data)." }
        value: { $ref: "#/components/schemas/NullableNumber" }
        name: { type: string }
        unit: { type: string }
        imputed:
          type: boolean
          description: True when forward-filled from an earlier year (e.g. LPI surveys).

    # ---------- /api/meta ----------
    SourceFreshness:
      type: object
      required: [id, name, url, status]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        status:
          type: string
          enum: [live, cached, fallback, mock, unavailable]
          description: How the backend obtained this source for the current build.
        retrieved_at: { type: [string, "null"], format: date-time }
        last_updated: { type: [string, "null"], description: "Publisher's own last-updated date if known." }
        latest_year: { type: [integer, "null"] }
        note: { type: string }

    Meta:
      type: object
      required: [drugs, observed_years, predicted_years, risk_years, latest_observed_year, model_version, sources]
      properties:
        drugs:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { $ref: "#/components/schemas/Drug" }
              label: { type: string }
              harm_weight: { type: number, description: "Relative harm weight used in exposure." }
        observed_years: { type: array, items: { type: integer } }
        predicted_years: { type: array, items: { type: integer } }
        risk_years: { type: array, items: { type: integer } }
        latest_observed_year: { type: integer }
        model_version: { type: string }
        livewire_classifier: { type: string, description: "mock or jev-1.13.0" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceFreshness" }
    MetaResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/Meta" }

    # ---------- /api/countries ----------
    Country:
      type: object
      required: [iso3, iso2, name, region, income_group, lat, lon]
      properties:
        iso3: { $ref: "#/components/schemas/Iso3" }
        iso2: { type: string }
        name: { type: string }
        region: { type: string }
        income_group: { type: string }
        capital: { type: [string, "null"] }
        lat: { type: [number, "null"], description: "Capital latitude (World Bank /country)." }
        lon: { type: [number, "null"] }
    CountriesResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Country" }

    # ---------- /api/routes ----------
    Driver:
      description: SHAP contribution of one feature to a predicted edge.
      type: object
      required: [feature, label, contribution, direction]
      properties:
        feature: { type: string, example: gdp_dest }
        label: { type: string, example: "Destination market size (GDP)" }
        contribution: { type: number, description: "SHAP value on the log-odds / log-volume scale." }
        direction: { type: string, enum: [up, down] }

    ConfidenceSignals:
      description: Independent signals that agree the corridor is active (SYSTEM_DESIGN section 6).
      type: object
      required: [seizures, price_gradient, oc_index, news, cultivation]
      properties:
        seizures: { type: boolean }
        price_gradient: { type: boolean }
        oc_index: { type: boolean }
        news: { type: boolean }
        cultivation: { type: boolean }

    Edge:
      type: object
      required: [id, from, to, drug, year, volume_norm, kg, cases, confidence, signals, is_emerging, probability, drivers]
      properties:
        evidence_ids:
          type: array
          items: { type: string }
          description: Route-evidence ids (/api/route-evidence/{evidence_id}) supporting this drug/from/to, direct reported pairs first.
        kg_basis:
          type: string
          enum: [allocated_seizure_scale, direct_pair_observation]
          description: >
            How `kg` was obtained. Always allocated_seizure_scale today (national seizure totals allocated over
            documented corridors); no pair-level volumes are observed. direct_pair_observation is reserved.
        id: { type: string, example: "cocaine:COL:ECU" }
        from: { $ref: "#/components/schemas/Iso3" }
        to: { $ref: "#/components/schemas/Iso3" }
        drug: { $ref: "#/components/schemas/Drug" }
        year: { type: integer }
        volume_norm:
          type: number
          minimum: 0
          maximum: 1
          description: Volume normalized within drug and year (0-1, share-scaled, log-compressed). Use for arc width.
        kg: { type: [number, "null"], description: "Estimated kg on the edge (observed) or predicted kg (predicted)." }
        cases: { type: [integer, "null"], description: "Seizure case count backing the edge (observed only)." }
        confidence: { type: number, minimum: 0, maximum: 100, description: "Evidence score. Use for arc opacity." }
        signals: { $ref: "#/components/schemas/ConfidenceSignals" }
        is_emerging: { type: boolean, description: "New or fast-growing corridor. Pulse on the map." }
        probability:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Predicted probability the edge is active (predicted mode only; null when observed).
        change_pct: { type: [number, "null"], description: "Volume change vs previous year in percent." }
        drivers:
          description: Top SHAP drivers (predicted mode). Empty for observed edges.
          type: array
          items: { $ref: "#/components/schemas/Driver" }
    Routes:
      type: object
      required: [year, mode, drug, edges]
      properties:
        year: { type: integer }
        mode: { type: string, enum: [observed, predicted] }
        drug: { type: [string, "null"], description: "Drug filter applied, or null for all." }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }
    RoutesResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/Routes" }

    # ---------- /api/country/{iso3} ----------
    IndicatorGroup:
      type: object
      required: [role, label, indicators]
      properties:
        role: { type: string, enum: [governance, logistics, gravity, vulnerability, outcome] }
        label: { type: string }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/WbValue" }

    PricePoint:
      type: object
      required: [year, value]
      properties:
        year: { type: integer }
        value: { type: number, description: "USD per gram" }
        purity_pct: { type: [number, "null"] }
    PriceSeries:
      type: object
      required: [iso3, drug, level, unit, points, latest, yoy_change_pct, source]
      properties:
        iso3: { $ref: "#/components/schemas/Iso3" }
        name: { type: string }
        drug: { $ref: "#/components/schemas/Drug" }
        level: { type: string, enum: [retail, wholesale] }
        unit: { type: string, enum: ["USD/g"] }
        points:
          type: array
          items: { $ref: "#/components/schemas/PricePoint" }
        latest: { type: [number, "null"] }
        yoy_change_pct: { type: [number, "null"] }
        source: { type: string, description: "Source id (see meta.sources)." }

    OcIndex:
      type: object
      required: [edition, criminality, resilience, markets]
      properties:
        edition: { type: integer, example: 2025 }
        criminality: { $ref: "#/components/schemas/NullableNumber" }
        resilience: { $ref: "#/components/schemas/NullableNumber" }
        markets:
          description: Criminal market scores (1-10) for drug markets.
          type: object
          required: [cocaine, heroin, cannabis, synthetic]
          properties:
            cocaine: { $ref: "#/components/schemas/NullableNumber" }
            heroin: { $ref: "#/components/schemas/NullableNumber" }
            cannabis: { $ref: "#/components/schemas/NullableNumber" }
            synthetic: { $ref: "#/components/schemas/NullableNumber" }
        source: { type: string }

    HarmReduction:
      description: Harm Reduction International service availability. null = unknown.
      type: object
      required: [year, nsp, oat, naloxone, dcr, prison_programs, coverage_score]
      properties:
        year: { type: integer }
        nsp: { type: [boolean, "null"], description: "Needle and syringe programmes" }
        oat: { type: [boolean, "null"], description: "Opioid agonist therapy" }
        naloxone: { type: [boolean, "null"], description: "Take-home naloxone" }
        dcr: { type: [boolean, "null"], description: "Drug consumption rooms" }
        prison_programs: { type: [boolean, "null"] }
        coverage_score: { type: number, minimum: 0, maximum: 100 }
        source: { type: string }

    RiskComponentDetail:
      type: object
      required: [feature, label, value, contribution]
      properties:
        feature: { type: string }
        label: { type: string }
        value: { $ref: "#/components/schemas/NullableNumber" }
        contribution: { type: number, description: "Points contributed to the component score." }
        provenance: { $ref: "#/components/schemas/WbValue" }

    RiskBreakdown:
      type: object
      required: [year, exposure, vulnerability, protection, score, rank, tier, exposure_detail, vulnerability_detail, protection_detail]
      properties:
        year: { type: integer }
        exposure: { type: number }
        vulnerability: { type: number }
        protection: { type: number }
        score: { type: number }
        rank: { type: integer }
        tier: { $ref: "#/components/schemas/RiskTier" }
        exposure_by_drug:
          type: object
          additionalProperties: { type: number }
        exposure_detail: { type: array, items: { $ref: "#/components/schemas/RiskComponentDetail" } }
        vulnerability_detail: { type: array, items: { $ref: "#/components/schemas/RiskComponentDetail" } }
        protection_detail: { type: array, items: { $ref: "#/components/schemas/RiskComponentDetail" } }
        trend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }

    CountryProfile:
      type: object
      required: [country, year, indicators, routes, prices, oc_index, harm_reduction, risk, cultivation]
      properties:
        country: { $ref: "#/components/schemas/Country" }
        year: { type: integer }
        indicators:
          type: array
          items: { $ref: "#/components/schemas/IndicatorGroup" }
        routes:
          type: object
          required: [inbound, outbound]
          properties:
            inbound: { type: array, items: { $ref: "#/components/schemas/Edge" } }
            outbound: { type: array, items: { $ref: "#/components/schemas/Edge" } }
        prices:
          type: array
          items: { $ref: "#/components/schemas/PriceSeries" }
        oc_index:
          oneOf:
            - { $ref: "#/components/schemas/OcIndex" }
            - { type: "null" }
        harm_reduction:
          oneOf:
            - { $ref: "#/components/schemas/HarmReduction" }
            - { type: "null" }
        risk:
          oneOf:
            - { $ref: "#/components/schemas/RiskBreakdown" }
            - { type: "null" }
        cultivation:
          description: Illicit crop cultivation (hectares), only for producer countries.
          type: array
          items: { $ref: "#/components/schemas/CultivationPoint" }
        briefing: { type: [string, "null"], description: "Short generated country briefing (may be null)." }
    CountryResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/CountryProfile" }

    CultivationPoint:
      type: object
      required: [iso3, crop, year, hectares]
      properties:
        iso3: { $ref: "#/components/schemas/Iso3" }
        crop: { type: string, enum: [coca, opium_poppy] }
        year: { type: integer }
        hectares: { $ref: "#/components/schemas/NullableNumber" }
        production_t: { $ref: "#/components/schemas/NullableNumber" }

    # ---------- /api/risk ----------
    RiskTier:
      type: string
      enum: [critical, high, elevated, moderate, low]
    TrendPoint:
      type: object
      required: [year, score]
      properties:
        year: { type: integer }
        score: { type: number }
    RiskRow:
      type: object
      required: [iso3, name, region, exposure, vulnerability, protection, score, rank, tier, delta_1y, trend]
      properties:
        iso3: { $ref: "#/components/schemas/Iso3" }
        name: { type: string }
        region: { type: string }
        exposure: { type: number, minimum: 0, maximum: 100 }
        vulnerability: { type: number, minimum: 0, maximum: 100 }
        protection: { type: number, minimum: 0, maximum: 100 }
        score: { type: number, minimum: 0, maximum: 100 }
        rank: { type: integer, minimum: 1 }
        tier: { $ref: "#/components/schemas/RiskTier" }
        delta_1y: { type: [number, "null"], description: "Score change vs previous year." }
        top_drug: { type: [string, "null"], description: "Drug contributing most exposure." }
        trend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
    RiskBoard:
      type: object
      required: [year, rows, weights]
      properties:
        year: { type: integer }
        weights:
          description: Weights used to combine components into the score.
          type: object
          required: [exposure, vulnerability, protection]
          properties:
            exposure: { type: number }
            vulnerability: { type: number }
            protection: { type: number }
        rows:
          type: array
          items: { $ref: "#/components/schemas/RiskRow" }
    RiskResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/RiskBoard" }

    # ---------- /api/prices ----------
    PricesResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: object
          required: [series]
          properties:
            series:
              type: array
              items: { $ref: "#/components/schemas/PriceSeries" }

    # ---------- /api/simulate ----------
    Shock:
      type: object
      required: [type, iso3, value]
      properties:
        type:
          type: string
          enum: [cultivation, legalization, customs_efficiency]
          description: >
            cultivation: value is a multiplier on illicit crop output at iso3 (0.05 = -95%).
            legalization: value 1 = drug legalized/regulated in iso3 (0 = reverse).
            customs_efficiency: value is a delta on the LPI customs score (1-5 scale) at iso3.
        iso3: { $ref: "#/components/schemas/Iso3" }
        drug:
          description: Drug affected. Required for legalization; cultivation implies cocaine (coca) or heroin (opium).
          oneOf:
            - { $ref: "#/components/schemas/Drug" }
            - { type: "null" }
        value: { type: number }
    SimulateRequest:
      type: object
      properties:
        scenario: { type: string, description: 'Plain English, e.g. "Colombia cuts coca 50%". Parsed into shocks.' }
        shocks:
          type: array
          items: { $ref: "#/components/schemas/Shock" }
        year: { type: integer, description: "Base year to shock. Defaults to the first predicted year." }
    EdgeDelta:
      type: object
      required: [from, to, drug, baseline_volume_norm, scenario_volume_norm, baseline_probability, scenario_probability, delta_pct]
      properties:
        from: { $ref: "#/components/schemas/Iso3" }
        to: { $ref: "#/components/schemas/Iso3" }
        drug: { $ref: "#/components/schemas/Drug" }
        baseline_volume_norm: { type: number }
        scenario_volume_norm: { type: number }
        baseline_kg: { $ref: "#/components/schemas/NullableNumber" }
        scenario_kg: { $ref: "#/components/schemas/NullableNumber" }
        baseline_probability: { type: number }
        scenario_probability: { type: number }
        delta_pct: { type: number }
    RiskDelta:
      type: object
      required: [iso3, name, baseline_score, scenario_score, delta, baseline_rank, scenario_rank]
      properties:
        iso3: { $ref: "#/components/schemas/Iso3" }
        name: { type: string }
        baseline_score: { type: number }
        scenario_score: { type: number }
        delta: { type: number }
        baseline_rank: { type: integer }
        scenario_rank: { type: integer }
    SimulationResult:
      type: object
      required: [scenario, parsed_by, shocks, year, edges_changed, risk_deltas, summary, warnings]
      properties:
        scenario: { type: [string, "null"] }
        parsed_by: { type: string, enum: [structured, rules, llm] }
        shocks:
          type: array
          items: { $ref: "#/components/schemas/Shock" }
        year: { type: integer }
        edges_changed:
          description: Edges whose volume moved by more than 1 percent, sorted by absolute change.
          type: array
          items: { $ref: "#/components/schemas/EdgeDelta" }
        risk_deltas:
          description: Countries whose risk score moved, sorted by absolute delta.
          type: array
          items: { $ref: "#/components/schemas/RiskDelta" }
        summary: { type: string }
        warnings: { type: array, items: { type: string } }
    SimulateResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/SimulationResult" }

    # ---------- /api/experiments/afghan-ban ----------
    SharePoint:
      type: object
      required: [year, value]
      properties:
        year: { type: integer }
        value: { $ref: "#/components/schemas/NullableNumber" }
    NamedSeries:
      type: object
      required: [id, label, unit, points]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/SharePoint" }
    ExperimentEdge:
      type: object
      required: [from, to, drug, before, predicted, actual]
      properties:
        from: { $ref: "#/components/schemas/Iso3" }
        to: { $ref: "#/components/schemas/Iso3" }
        drug: { $ref: "#/components/schemas/Drug" }
        before: { type: number, description: "volume_norm in the pre-ban reference year" }
        predicted: { type: number, description: "volume_norm predicted after the injected shock" }
        actual: { $ref: "#/components/schemas/NullableNumber" }
        direction_correct: { type: [boolean, "null"] }
    AfghanBan:
      type: object
      required: [title, summary, ban_year, train_through, shock, series, edges, metrics, verdict]
      properties:
        title: { type: string }
        summary: { type: string }
        ban_year: { type: integer }
        train_through: { type: integer }
        shock: { $ref: "#/components/schemas/Shock" }
        series:
          description: Before/after series (cultivation, production, prices, route shares).
          type: array
          items: { $ref: "#/components/schemas/NamedSeries" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ExperimentEdge" }
        metrics:
          type: object
          required: [direction_accuracy, spearman, n_edges]
          properties:
            direction_accuracy: { $ref: "#/components/schemas/NullableNumber" }
            spearman: { $ref: "#/components/schemas/NullableNumber" }
            n_edges: { type: integer }
            sea_share_before: { $ref: "#/components/schemas/NullableNumber" }
            sea_share_predicted: { $ref: "#/components/schemas/NullableNumber" }
            sea_share_actual: { $ref: "#/components/schemas/NullableNumber" }
        verdict: { type: string }
    AfghanBanResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/AfghanBan" }

    # ---------- /api/metrics ----------
    ModelScores:
      type: object
      required: [auc, spearman, precision_at_20]
      properties:
        auc: { $ref: "#/components/schemas/NullableNumber" }
        spearman: { $ref: "#/components/schemas/NullableNumber" }
        precision_at_20: { $ref: "#/components/schemas/NullableNumber" }
        n: { type: integer }
    Metrics:
      type: object
      required: [model_version, backtest, spillover, livewire]
      properties:
        model_version: { type: string }
        backtest:
          type: object
          required: [train_through, test_years, hurdle, gravity_baseline]
          properties:
            train_through: { type: integer }
            test_years: { type: array, items: { type: integer } }
            hurdle: { $ref: "#/components/schemas/ModelScores" }
            gravity_baseline: { $ref: "#/components/schemas/ModelScores" }
            per_drug:
              type: object
              additionalProperties: { $ref: "#/components/schemas/ModelScores" }
            per_year:
              type: object
              additionalProperties: { $ref: "#/components/schemas/ModelScores" }
            top_features:
              type: array
              items:
                type: object
                required: [feature, label, mean_abs_shap]
                properties:
                  feature: { type: string }
                  label: { type: string }
                  mean_abs_shap: { type: number }
        afghan_ban:
          type: object
          properties:
            direction_accuracy: { $ref: "#/components/schemas/NullableNumber" }
            spearman: { $ref: "#/components/schemas/NullableNumber" }
            verdict: { type: string }
        spillover:
          type: object
          required: [hypothesis, outcome, n, auc_vulnerability_only, auc_with_exposure, lr_p_value, supported, statement]
          properties:
            hypothesis: { type: string }
            outcome: { type: string, description: "Outcome definition used as the target." }
            n: { type: integer }
            auc_vulnerability_only: { $ref: "#/components/schemas/NullableNumber" }
            auc_with_exposure: { $ref: "#/components/schemas/NullableNumber" }
            exposure_coef: { $ref: "#/components/schemas/NullableNumber" }
            lr_p_value: { $ref: "#/components/schemas/NullableNumber" }
            supported: { type: boolean }
            statement: { type: string }
            by_outcome:
              type: object
              additionalProperties:
                type: object
                properties:
                  n: { type: integer }
                  auc_vulnerability_only: { $ref: "#/components/schemas/NullableNumber" }
                  auc_with_exposure: { $ref: "#/components/schemas/NullableNumber" }
                  lr_p_value: { $ref: "#/components/schemas/NullableNumber" }
        livewire:
          type: object
          required: [classifier, n_labeled, field_accuracy]
          properties:
            classifier: { type: string }
            n_labeled: { type: integer }
            field_accuracy:
              type: object
              additionalProperties: { $ref: "#/components/schemas/NullableNumber" }
            note: { type: string }
    MetricsResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/Metrics" }

    # ---------- /api/livewire + WS ----------
    LiveEvent:
      type: object
      required: [id, published_at, title, url, source_domain, event_type, drug, origin, transit, destination,
                 size, is_event, route_mentioned, confidence, is_anomaly, edge_probability, classifier, lat, lon]
      properties:
        id: { type: string }
        published_at: { type: string, format: date-time, description: "From GDELT metadata, never from the classifier." }
        title: { type: string }
        url: { type: string }
        source_domain: { type: string }
        language: { type: string }
        event_type:
          type: string
          enum: [seizure, arrest_or_indictment, lab_dismantled, law_or_policy_change, violence, corruption, other]
        drug: { $ref: "#/components/schemas/LiveDrug" }
        origin: { type: [string, "null"], description: "ISO3 or null when not stated" }
        transit: { type: [string, "null"] }
        destination: { type: [string, "null"] }
        size: { type: string, enum: [small, notable, major, record] }
        is_event: { type: number, minimum: 0, maximum: 1, description: "P(article describes a specific event)" }
        route_mentioned: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        is_anomaly: { type: boolean }
        anomaly_reason: { type: [string, "null"] }
        edge_probability: { type: [number, "null"], description: "Model probability for the origin->destination edge." }
        classifier: { type: string, description: "mock or jev-1.13.0" }
        lat: { type: [number, "null"], description: "Map pin (country centroid of the most specific location)." }
        lon: { type: [number, "null"] }
    LivewireResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: object
          required: [events, classifier]
          properties:
            classifier: { type: string }
            events:
              type: array
              items: { $ref: "#/components/schemas/LiveEvent" }

    # ---------- /api/command ----------
    CommandRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
    CommandResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: object
          required: [text, intent, params, confidence, parser, message]
          properties:
            text: { type: string }
            intent:
              type: string
              enum: [routes, country, risk, shock, news, compare, year, predict, prices, experiment, metrics, help, blocked, unknown]
              description: blocked = request falls outside the design boundary (e.g. asks where enforcement is weak).
            params:
              type: object
              properties:
                drug: { type: [string, "null"] }
                iso3: { type: [string, "null"] }
                iso3_b: { type: [string, "null"] }
                year: { type: [integer, "null"] }
                limit: { type: [integer, "null"] }
                predict: { type: [boolean, "null"] }
                shocks:
                  type: array
                  items: { $ref: "#/components/schemas/Shock" }
            confidence: { type: number, minimum: 0, maximum: 1 }
            parser: { type: string, enum: [rules, jev, mock] }
            message: { type: string }

    PeopleSource:
      type: object
      required: [url, title, publisher, language, claim]
      properties:
        url: { type: string, pattern: "^https?://" }
        title: { type: string, minLength: 1 }
        publisher: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        publishedAt: { type: string }
        claim: { type: string, minLength: 1, description: "What this source establishes about the record." }

    PersonRegion:
      type: object
      description: Country-level association only; never coordinates or addresses.
      required: [iso3, label]
      additionalProperties: false
      properties:
        iso3: { type: string, pattern: "^[A-Z]{3}$" }
        label: { type: string }
        evidence:
          type: object
          required: [claim, sourceUrl]
          properties:
            claim: { type: string }
            period: { type: string }
            sourceUrl: { type: string, description: "Equals one of the person's source URLs." }

    PersonEvent:
      type: object
      required: [id, occurredAt, type, title, summary, source]
      properties:
        id: { type: string }
        occurredAt: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "Date the source gives for the occurrence." }
        type: { type: string, enum: [arrest, charge, conviction, sentence, sanction, development] }
        title: { type: string }
        summary: { type: string }
        source: { $ref: "#/components/schemas/PeopleSource" }

    Person:
      type: object
      required: [id, name, status, prominence, organizationIds, regions, drugs, sources]
      properties:
        id: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        status: { type: string, enum: [convicted, charged, sanctioned, reported], description: "Legal status as established by the cited sources; charged is not convicted. Never overwritten by lifeStatus." }
        statusAsOf: { type: string }
        lifeStatus: { $ref: "#/components/schemas/PersonLifeStatus" }
        legalHistory: { type: array, items: { $ref: "#/components/schemas/PersonLegalStatus" }, description: "Dated legal-status claims, newest first. Present only when the manifest supplies it." }
        roleLabel: { type: string }
        prominence: { type: integer, enum: [1, 2, 3], description: "Zoom tier at which the person appears without a search." }
        organizationIds: { type: array, items: { type: string } }
        regions: { type: array, items: { $ref: "#/components/schemas/PersonRegion" }, description: "May be empty when no country is sourced (see unlocated=1)." }
        drugs: { type: array, items: { type: string } }
        photo:
          type: object
          description: Present only when reuse rights are documented.
          required: [url, credit, license, sourceUrl]
          properties:
            url: { type: string }
            credit: { type: string }
            license: { type: string }
            licenseUrl: { type: string }
            sourceUrl: { type: string }
        events: { type: array, items: { $ref: "#/components/schemas/PersonEvent" }, description: "Newest first." }
        sources: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PeopleSource" } }

    Organization:
      type: object
      required: [id, name, regions, sources]
      properties:
        id: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string, pattern: "^[A-Z]{3}$" } }
        sources: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PeopleSource" } }

    Connection:
      type: object
      description: A relationship documented by its own sources; never inferred from shared membership.
      required: [id, fromId, toId, type, label, sources]
      properties:
        id: { type: string }
        fromId: { type: string }
        toId: { type: string }
        type: { type: string }
        label: { type: string }
        sources: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PeopleSource" } }

    PeopleDataset:
      type: object
      required: [people, organizations, connections]
      properties:
        people: { type: array, items: { $ref: "#/components/schemas/Person" } }
        organizations: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        connections: { type: array, items: { $ref: "#/components/schemas/Connection" } }

    PeoplePageMeta:
      allOf:
        - { $ref: "#/components/schemas/PeopleMeta" }
        - type: object
          required: [total, next_cursor]
          properties:
            total: { type: integer, minimum: 0, description: "People matching the filters (all pages)." }
            next_cursor: { type: [string, "null"] }
            total_connections: { type: integer, minimum: 0 }

    PeoplePageResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/PeoplePageMeta" }
        data: { $ref: "#/components/schemas/PeopleDataset" }

    PeopleNetworkResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          allOf:
            - { $ref: "#/components/schemas/PeoplePageMeta" }
            - { type: object, required: [total_connections] }
        data: { $ref: "#/components/schemas/PeopleDataset" }

    PeopleCountriesResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/PeopleMeta" }
        data:
          type: array
          items:
            type: object
            required: [iso3, total, visible]
            properties:
              iso3: { type: string, pattern: "^[A-Z]{3}$" }
              total: { type: integer, minimum: 0 }
              visible: { type: integer, minimum: 0 }

    PersonResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/PeopleMeta" }
        data:
          type: object
          required: [person, organizations, connections]
          properties:
            person: { $ref: "#/components/schemas/Person" }
            organizations: { type: array, items: { $ref: "#/components/schemas/Organization" } }
            connections: { type: array, items: { $ref: "#/components/schemas/Connection" } }

    PeopleSnapshot:
      type: object
      description: Which copy of the People manifest answered. `github-main` is re-read from the repo's main branch at most every TRACE_PEOPLE_REFRESH_SECONDS; `bundled` is the copy packaged with the deployment.
      required: [origin, fetched_at]
      properties:
        origin: { type: string, enum: [github-main, bundled] }
        fetched_at: { type: [string, "null"], format: date-time, description: "When the github-main copy was last fetched or revalidated; null for bundled." }

    PeopleMeta:
      description: ResponseMeta plus the People snapshot provenance; used by every /api/people* response.
      allOf:
        - { $ref: "#/components/schemas/ResponseMeta" }
        - type: object
          properties:
            people_snapshot: { $ref: "#/components/schemas/PeopleSnapshot" }

    PersonLifeStatus:
      type: object
      description: >
        Optional biographical status, independent of legal `status`: a death never replaces a charge, conviction or
        sanction. Omitted when not established by a source. Invalid entries are dropped, not fatal.
      required: [value, source]
      properties:
        value: { type: string, enum: [deceased, unknown] }
        deathDate: { type: string, pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$", description: "Only with value=deceased; YYYY, YYYY-MM or YYYY-MM-DD as precise as the source." }
        asOf: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "Date the source establishes this status." }
        source: { $ref: "#/components/schemas/PeopleSource" }

    PersonLegalStatus:
      type: object
      description: >
        One dated legal-status claim as its source states it. A historical charge does not imply the case is pending
        today; `qualifier` carries the legal wording (e.g. "indicted; allegations only", "conviction on appeal").
      required: [status, date, qualifier, source]
      properties:
        status: { type: string, enum: [reported, arrested, charged, convicted, sentenced, acquitted, dismissed, sanctioned, delisted, extradited, released] }
        date: { type: string, pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$", description: "Date the source gives, as precise as it states." }
        qualifier: { type: string, minLength: 1 }
        jurisdiction: { type: string, minLength: 1 }
        source: { $ref: "#/components/schemas/PeopleSource" }

    RouteEvidencePairType:
      type: string
      enum: [direct_reported_pair, interpreted_corridor, narrative_context]

    RouteEvidenceSource:
      type: object
      required: [id, publisher, title, publication_year, url]
      properties:
        id: { type: string }
        publisher: { type: string }
        title: { type: string }
        publication_year: { type: integer }
        url: { type: string, format: uri }

    RouteEvidenceCitation:
      description: An original publication behind an interpreted corridor (seed/README.md citation key).
      type: object
      required: [key, publisher, title, publication_year, url]
      properties:
        key: { type: string, example: "WDR2026-7.3.1" }
        publisher: { type: string }
        title: { type: string }
        publication_year: { type: integer }
        url: { type: [string, "null"], description: "Null where the repo does not yet cite a URL for this key." }

    RouteEvidence:
      type: object
      required: [id, drug, from, to, geography_from, geography_to, pair_type, basis, period, source, source_locator,
                 citations, original_excerpt, geometry_precision, caveat, supports_edge_ids]
      properties:
        id: { type: string, example: "cocaine:COL:ECU:unodc-cocaine-2023", description: "drug:FROM:TO:source_id (narrative: drug:claim:claim_id:source_id)." }
        drug: { $ref: "#/components/schemas/Drug" }
        from: { type: [string, "null"], pattern: "^[A-Z]{3}$", description: "Null for narrative_context." }
        to: { type: [string, "null"], pattern: "^[A-Z]{3}$", description: "Null for narrative_context." }
        geography_from: { type: [string, "null"], description: "Regional text (narrative_context only)." }
        geography_to: { type: [string, "null"], description: "Regional text (narrative_context only)." }
        pair_type: { $ref: "#/components/schemas/RouteEvidencePairType" }
        basis:
          type: string
          description: >
            direct_reported_pair: `reported seizure origin/destination`, `reported provenance` or `official route
            assessment`. interpreted_corridor: `regional route map (TRACE transcription)`, `report text (TRACE
            transcription)` or `regional route map and report text (TRACE transcription)`. narrative_context:
            `published aggregate context (reported departures)`.
        period:
          description: "[start, end] evidence period, or null when the source gives none (publication year is not an observation)."
          type: [array, "null"]
          items: { type: integer }
          minItems: 2
          maxItems: 2
        source: { $ref: "#/components/schemas/RouteEvidenceSource" }
        source_locator: { type: string, description: "Exact page, section, paragraph or bullet in the source." }
        citations: { type: array, items: { $ref: "#/components/schemas/RouteEvidenceCitation" } }
        original_excerpt: { type: [string, "null"] }
        geometry_precision:
          type: string
          description: "`country pair`, `country pair interpreted from regional map/text`, or `regional text (...)`. Never city-level."
        caveat: { type: string }
        supports_edge_ids:
          type: array
          description: /api/routes edge ids (drug:FROM:TO) this record supports; empty for narrative_context.
          items: { type: string }

    RouteEvidencePageMeta:
      allOf:
        - { $ref: "#/components/schemas/ResponseMeta" }
        - type: object
          required: [total, next_cursor]
          properties:
            total: { type: integer, minimum: 0, description: "Records matching the filters (all pages)." }
            next_cursor: { type: [string, "null"] }

    RouteEvidencePageResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/RouteEvidencePageMeta" }
        data: { type: array, items: { $ref: "#/components/schemas/RouteEvidence" } }

    RouteEvidenceItemResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/RouteEvidence" }

    RouteEvidenceSourcesResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/RouteEvidenceSource" }
              - type: object
                required: [layer]
                properties:
                  layer: { $ref: "#/components/schemas/RouteEvidencePairType" }

    EvidencePageMeta:
      allOf:
        - { $ref: "#/components/schemas/ResponseMeta" }
        - type: object
          required: [total, next_cursor]
          properties:
            total: { type: integer, minimum: 0, description: "Rows matching the filters (all pages)." }
            next_cursor: { type: [string, "null"] }

    EvidenceKind: { type: string, enum: [research, market] }

    EvidenceValueSummary:
      type: object
      required: [id, kind, metric_key, label, iso3, drug, year, value, unit]
      properties:
        id: { type: string, description: "Research metric_id, or market derived_id as a string of digits." }
        kind: { $ref: "#/components/schemas/EvidenceKind" }
        metric_key: { type: string, example: seizure_edition_revision_pct }
        label: { type: string }
        iso3: { type: [string, "null"] }
        drug: { type: [string, "null"], description: "Research drug, or the exact market substance." }
        year: { type: [integer, "null"] }
        value: { type: number }
        unit: { type: string }

    EvidenceValuesResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/EvidencePageMeta" }
        data:
          type: object
          required: [values]
          properties:
            values: { type: array, items: { $ref: "#/components/schemas/EvidenceValueSummary" } }

    EvidenceFormula:
      type: object
      required: [expression, version, selection_rule, interpretation]
      properties:
        expression: { type: string }
        version: { type: [integer, "null"], description: "Research metric definition version; null for market values." }
        selection_rule: { type: [string, "null"], description: "Research selection rule, or market eligibility rule." }
        interpretation: { type: [string, "null"] }

    EvidenceCell:
      description: One original workbook cell (unodc_cells or market_cells).
      type: object
      required: [col_no, value_text, value_number, value_type, italic]
      properties:
        col_no: { type: integer }
        value_text: { type: [string, "null"] }
        value_number: { type: [number, "null"] }
        value_type: { type: [string, "null"], example: number }
        italic: { type: boolean }

    EvidenceSourceRow:
      description: The source workbook row behind an input, with its parsed observation and every original cell.
      type: object
      required: [source_id, sheet, row_no, observation, cells]
      properties:
        source_id: { type: string }
        sheet: { type: string }
        row_no: { type: integer }
        observation:
          description: The parsed unodc_seizure_observations or market_observations row (null if missing).
          type: [object, "null"]
        cells: { type: array, items: { $ref: "#/components/schemas/EvidenceCell" } }

    EvidenceWorldBank:
      type: object
      required: [indicator_code, source_id, iso3, year, lastupdated, download_url, request_id]
      properties:
        indicator_code: { type: string, example: VC.IHR.PSRC.P5 }
        source_id: { type: integer, example: 2 }
        iso3: { type: string }
        year: { type: integer }
        lastupdated: { type: [string, "null"], description: "World Bank dataset lastupdated; not a publication year." }
        lastupdated_note: { type: string }
        download_url: { type: string, description: "wb_downloads.url of the API page the value came from." }
        request_id: { type: string }
        retrieved_at: { type: [string, "null"] }
        sha256: { type: [string, "null"] }

    EvidenceSeizureEdition:
      type: object
      required: [edition, kg, source_id]
      properties:
        edition: { type: integer }
        kg: { type: [number, "null"] }
        source_id: { type: string }

    EvidenceInput:
      type: object
      required: [role, source_table, source_key, source_url, publication_year, observation_year, input_value, input_unit,
                 transform]
      properties:
        role: { type: string, example: predictor_source_row }
        source_table: { type: string, enum: [seizures_annex, unodc_seizure_observations, wb_indicators, market_observations] }
        source_key: { type: string, example: "unodc_seizure_observations:hist2012_Seizures|sSeizuresA|670" }
        source_id: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
        source_title: { type: [string, "null"] }
        source_checksum: { type: [string, "null"] }
        publication_year: { type: [integer, "null"] }
        observation_year: { type: [integer, "null"] }
        input_value: { type: [number, "null"] }
        input_unit: { type: [string, "null"] }
        transform: { type: [string, "null"] }
        source_row: { oneOf: [{ $ref: "#/components/schemas/EvidenceSourceRow" }, { type: "null" }] }
        world_bank: { $ref: "#/components/schemas/EvidenceWorldBank" }
        edition: { type: integer, description: "seizures_annex inputs: the annex edition this input used." }
        editions:
          description: "seizures_annex inputs: every published annex edition for this country, year and drug."
          type: array
          items: { $ref: "#/components/schemas/EvidenceSeizureEdition" }
        revised_between_editions: { type: boolean }
        revision_label: { type: [string, "null"] }

    EvidenceMarketSource:
      type: object
      required: [source_id, url, edition, sha256]
      properties:
        source_id: { type: string }
        url: { type: [string, "null"] }
        edition: { type: [integer, "null"] }
        sha256: { type: [string, "null"] }
        retrieved_at: { type: [string, "null"] }
        citation: { type: [string, "null"] }
        license_note: { type: [string, "null"] }

    EvidenceValue:
      type: object
      required: [id, kind, metric_key, label, iso3, drug, year, value, unit, formula, support_count, support_count_basis,
                 observation_year, source_publication_year, source_title, source_url, source_key, quality_flags, caveat,
                 revision_label, inputs, market, regression_sample]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/EvidenceKind" }
        metric_key: { type: string }
        label: { type: string }
        iso3: { type: [string, "null"] }
        drug: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        value: { type: number }
        unit: { type: string }
        numerator: { type: [number, "null"] }
        denominator: { type: [number, "null"] }
        formula: { $ref: "#/components/schemas/EvidenceFormula" }
        support_count: { type: integer, minimum: 1, description: "Linked input rows, not independent countries." }
        support_count_basis: { type: string }
        observation_year: { type: [integer, "null"] }
        source_publication_year: { type: [integer, "null"], description: "Source edition; never the collection date." }
        first_publication_year: { type: [integer, "null"] }
        last_publication_year: { type: [integer, "null"] }
        source_title: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
        source_key: { type: [string, "null"] }
        quality_flags: { type: array, items: { type: string } }
        caveat: { type: [string, "null"] }
        revision_label: { type: [string, "null"], description: "Set when a source-edition seizure revision is involved." }
        inputs: { type: array, items: { $ref: "#/components/schemas/EvidenceInput" } }
        market:
          oneOf:
            - type: "null"
            - type: object
              required: [substance, form, market_level, source]
              properties:
                substance: { type: string }
                form: { type: [string, "null"] }
                market_level: { type: [string, "null"] }
                source: { $ref: "#/components/schemas/EvidenceMarketSource" }
        regression_sample:
          oneOf:
            - type: "null"
            - type: object
              required: [sample_id, seizure_year, outcome_year, log1p_seizure_kg, homicide_per_100k]
              properties:
                sample_id: { type: string }
                seizure_year: { type: integer }
                outcome_year: { type: integer }
                log1p_seizure_kg: { type: number }
                homicide_per_100k: { type: number }

    EvidenceValueResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data: { $ref: "#/components/schemas/EvidenceValue" }

    EvidenceHealthSource:
      type: object
      required: [source_id, title, url, edition_year]
      properties:
        source_id: { type: string }
        title: { type: [string, "null"] }
        publisher: { type: [string, "null"] }
        url: { type: [string, "null"] }
        edition_year: { type: [integer, "null"] }

    EvidencePrevalenceRow:
      type: object
      required: [substance, year, reference_period, population, age_group, sex, value_pct, low_pct, high_pct,
                 estimate_status, estimate_label, method, source, source_row]
      properties:
        substance: { type: string }
        substance_detail: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        year_text: { type: [string, "null"] }
        reference_period: { type: string, enum: [past_year, past_month, lifetime] }
        population: { type: string }
        age_group: { type: [string, "null"] }
        sex: { type: [string, "null"] }
        value_pct: { type: [number, "null"] }
        low_pct: { type: [number, "null"] }
        high_pct: { type: [number, "null"] }
        estimate_status: { type: string, enum: [published_estimate, source_reported] }
        estimate_label: { type: string }
        method: { type: [string, "null"] }
        attribution: { type: [string, "null"] }
        adjustment_note: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        source: { $ref: "#/components/schemas/EvidenceHealthSource" }
        source_row:
          type: object
          required: [sheet, row_no, cell_no]
          properties:
            sheet: { type: string }
            row_no: { type: integer }
            cell_no: { type: integer }

    EvidenceCoverageRow:
      type: object
      required: [year, substance_group, sex, value_pct, lower_pct, upper_pct, nature_code, nature_label, modelled, source]
      properties:
        year: { type: integer }
        substance_group: { type: string, example: DRUG_TOTAL }
        sex: { type: string, example: BOTHSEX }
        value_pct: { type: number }
        lower_pct: { type: [number, "null"] }
        upper_pct: { type: [number, "null"] }
        nature_code: { type: string, enum: [M, C] }
        nature_label: { type: string, description: "Explicit: officially modelled estimate (M) or country-reported data (C)." }
        modelled: { type: boolean }
        attribution: { type: [string, "null"] }
        footnotes: { type: array, items: { type: string } }
        source: { $ref: "#/components/schemas/EvidenceHealthSource" }
        source_row_no: { type: integer }

    EvidenceHealthResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: object
          required: [iso3, prevalence, treatment_coverage]
          properties:
            iso3: { type: string, pattern: "^[A-Z]{3}$" }
            prevalence:
              type: object
              required: [total, rows, label]
              properties:
                total: { type: integer, minimum: 0 }
                rows: { type: array, items: { $ref: "#/components/schemas/EvidencePrevalenceRow" } }
                label: { type: string }
            treatment_coverage:
              type: object
              required: [total, rows, label, nature_labels]
              properties:
                total: { type: integer, minimum: 0 }
                rows: { type: array, items: { $ref: "#/components/schemas/EvidenceCoverageRow" } }
                label: { type: string }
                nature_labels:
                  type: object
                  required: [M, C]
                  properties:
                    M: { type: string }
                    C: { type: string }

    EvidenceOverdoseRow:
      type: object
      required: [period_end, end_year, end_month, period_kind, indicator, metric_kind, unit, reported_value,
                 predicted_value, percent_complete, suppressed, status]
      properties:
        period_end: { type: string, pattern: "^\\d{4}-\\d{2}$", description: "Last month of the 12-month window." }
        end_year: { type: integer }
        end_month: { type: integer, minimum: 1, maximum: 12 }
        period_kind: { type: string, example: "12 month-ending" }
        indicator: { type: string, description: "Exact CDC label, e.g. Synthetic opioids, excl. methadone (T40.4)." }
        metric_kind: { type: string }
        unit: { type: string, example: deaths }
        reported_value: { type: [number, "null"], description: "Null when suppressed or unavailable." }
        predicted_value: { type: [number, "null"] }
        percent_complete: { type: [number, "null"] }
        percent_pending_investigation: { type: [number, "null"] }
        suppressed: { type: boolean }
        status: { type: string, enum: [provisional] }
        footnote: { type: [string, "null"] }
        footnote_symbol: { type: [string, "null"] }

    EvidenceOverdoseResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/EvidencePageMeta" }
        data:
          type: object
          required: [state, state_name, label, indicators, source_url, source_publication_year, rows]
          properties:
            state: { type: string }
            state_name: { type: [string, "null"] }
            label: { type: string }
            indicators: { type: array, items: { type: string } }
            source_url: { type: string }
            source_publication_year: { type: "null" }
            rows: { type: array, items: { $ref: "#/components/schemas/EvidenceOverdoseRow" } }

    EvidenceResearchModelResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        data:
          type: object
          required: [model_key, specification, outcome, predictor, coefficient, standard_error, p_value, ci_low, ci_high,
                     n, countries, cluster_count, caveat, interpretation, metric_key, sample_rows]
          properties:
            model_key: { type: string }
            specification: { type: string }
            outcome: { type: string }
            predictor: { type: string }
            coefficient: { type: number }
            standard_error: { type: number }
            p_value: { type: number }
            ci_low: { type: number }
            ci_high: { type: number }
            n: { type: integer }
            countries: { type: integer }
            first_predictor_year: { type: integer }
            last_predictor_year: { type: integer }
            cluster_count: { type: integer }
            r_squared: { type: [number, "null"] }
            caveat: { type: string }
            computed_at: { type: string }
            interpretation: { type: string }
            metric_key: { type: string }
            sample_rows: { type: integer }
